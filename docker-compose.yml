name: blogTraefik

services:
  frontend:
    build: .
    container_name: blogTraefik_app
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blogTraefik.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.blogTraefik.entrypoints=${ENTRYPOINT}"
      # Comentar la linea de abajo si estas en local y descomentarla si estas en produccion
      - "traefik.http.routers.blogTraefik.tls.certresolver=${CERTRESOLVER}"
      - "traefik.http.services.blogTraefik.loadbalancer.server.port=80"

networks:
  web:
    external: true